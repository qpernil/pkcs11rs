name: CI

on:
  push:
  pull_request:

env:
  # PreviewSign uses the FIDO signer and ASN.1 DER signature encoding.
  VIRTUAL_YUBIKEY_REVISION: 9c4b7012b830ec9cce9fb0af1264edf7fe2055e6

jobs:
  pkcs11test:
    name: Google/Yubico pkcs11test compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out pinned pkcs11test fork
        uses: actions/checkout@v7
        with:
          repository: qpernil/pkcs11test
          ref: bab8443b01c712e81460af18b3ce479624e64358
          path: target/pkcs11test-source

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential opensc openssl pkg-config libssl-dev

      - name: Build pkcs11test fork and check fixture contracts
        run: |
          make -C target/pkcs11test-source -j2
          make -C target/pkcs11test-source check

      - name: Test runner reporting and isolation
        run: python -m unittest discover -s integration -p 'test_pkcs11test_runner.py'

      - name: Run full pkcs11test suite on disposable software tokens
        run: >-
          python integration/run_pkcs11test.py
          --pkcs11test target/pkcs11test-source/pkcs11test
          --results target/pkcs11test-results.json

      - name: Upload pkcs11test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pkcs11test-results-linux
          path: target/pkcs11test-results.json
          if-no-files-found: warn

  virtual-yubihsm-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yubihsm2
            features: firmware-yubihsm2
          - name: test-prefixed-ecdh
            features: test-firmware-prefixed-ecdh
          - name: test-session-objects
            features: test-firmware-session-objects
          - name: secure-channel
            features: firmware-secure-channel
          - name: full
            features: firmware-full

    name: embedded firmware (${{ matrix.name }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Test embedded firmware forwarding
        run: >-
          cargo test --locked -p pkcs11rs-connector --no-default-features
          --features "${{ matrix.features }}"
          embedded_firmware_profile_is_forwarded_to_the_core

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libpcsclite-dev \
            libssl-dev \
            libudev-dev \
            pkg-config

      - name: Build OpenSC 0.27.1
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            https://github.com/OpenSC/OpenSC/releases/download/0.27.1/opensc-0.27.1.tar.gz \
            --output opensc-0.27.1.tar.gz
          echo '976f4a23eaf3397a1a2c3a7aac80bf971a8c3d829c9a79f06145bfaeeae5eca7  opensc-0.27.1.tar.gz' | sha256sum --check
          tar -xzf opensc-0.27.1.tar.gz
          cd opensc-0.27.1
          ./configure --prefix="$RUNNER_TEMP/opensc" \
            --enable-p11_system_config_modules="$RUNNER_TEMP/opensc/share/p11-kit/modules" \
            --disable-man --disable-tests --disable-notify --disable-readline
          make -j2
          make install
          echo "$RUNNER_TEMP/opensc/bin" >> "$GITHUB_PATH"

      - name: Check generated PKCS #11 bindings
        run: cargo xtask bindings --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run published cryptographic known-answer tests
        run: cargo test --manifest-path ../software-key-core/Cargo.toml --locked kat_

      - name: Run portable provider tests
        run: cargo test --locked -p pkcs11rs --no-default-features --lib

      - name: Run release Rust tests
        run: cargo test --release --locked --all-features

      - name: Run embedded virtual YubiKey PKCS #11 tests
        run: cargo test --locked --no-default-features --features embedded-virtual-yubikey preview_sign_embedded

      - name: Run complete PQC provider matrix
        run: cargo test --locked -p pkcs11rs --lib --no-default-features --features embedded-virtual-yubikey pqc_matrix -- --test-threads=1

      - name: Run full PQC matrix through the connector-embedded HSM
        run: |
          cargo build --locked -p pkcs11rs-connector --no-default-features --features firmware-full
          state_dir=$(mktemp -d)
          target/debug/pkcs11rs-connector --listen 127.0.0.1:12346 \
            --hardware-discovery false --virtual-yubihsm "99001001=$state_dir" \
            > "$RUNNER_TEMP/pqc-connector.log" 2>&1 &
          connector_pid=$!
          trap 'kill "$connector_pid"; wait "$connector_pid" || true; rm -rf "$state_dir"' EXIT
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:12346/connector/status", timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("PQC connector did not become ready")
          PYREADY
          PKCS11RS_PQC_SERIAL=99001001 PKCS11RS_PQC_ENDPOINT=http://127.0.0.1:12346 \
            PKCS11RS_PQC_FACTORY_AUTH=1 cargo test --locked -p pkcs11rs --lib \
            --no-default-features --features embedded-virtual-yubikey \
            pqc_matrix_deployed_yubihsm -- --ignored --nocapture --test-threads=1

      - name: Run all virtual FIDO ML-DSA credential variants
        run: cargo test --manifest-path ../virtual-yubikey/Cargo.toml --locked -p virtual-yubikey-core ml_dsa_credentials_persist_and_complete_verified_assertions

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OpenSC client integration tests
        run: |
          python -m unittest discover -s integration -p 'test_*.py'
          python integration/run_clients.py --client opensc

      - name: Upload client integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-integration-linux
          path: target/client-results.json
          if-no-files-found: warn

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-linux
          path: target/oasis-results
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            libudev-dev \
            pkg-config

      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace --all-features

      - name: Check binding generator minimum supported Rust version
        run: cargo check --locked --manifest-path xtask/Cargo.toml

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: pkcs11rs

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git virtual-yubikey
          git -C virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git virtual-yubihsm
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git raspberry-pi-i2c-target

      - name: Check workspace advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          manifest-path: ./pkcs11rs/Cargo.toml

      - name: Check binding generator advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          manifest-path: ./pkcs11rs/xtask/Cargo.toml

  macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm
          git clone --depth 1 https://github.com/qpernil/raspberry-pi-i2c-target.git ../raspberry-pi-i2c-target

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          brew install pkg-config opensc libp11 openssl@3

      - name: Install iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Check generated PKCS #11 bindings
        run: cargo xtask bindings --check

      - name: Build dylib
        run: cargo build --locked

      - name: Run Rust tests
        id: rust-tests
        run: cargo test --locked

      - name: Diagnose macOS Rust test crash
        if: failure() && steps.rust-tests.outcome == 'failure'
        run: |
          test_binary=$(cargo test --locked -p pkcs11rs --lib --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .profile.test) | .executable // empty')
          lldb --batch \
            -o 'settings set target.disable-aslr false' \
            -o 'settings set frame-format "frame #${frame.index}: ${function.name}\n"' \
            -o run -k 'thread backtrace all' -- "$test_binary"

      - name: Upload macOS crash reports
        if: failure() && steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: macos-rust-crash-reports
          path: ~/Library/Logs/DiagnosticReports/pkcs11rs*.ips
          if-no-files-found: warn

      - name: Build iOS XCFramework
        run: cargo xtask ios --release

      - name: Build iOS example applications
        run: |
          xcodebuild -quiet \
            -project examples/ios/PKCS11RSPhoneSmoke/PKCS11RSPhoneSmoke.xcodeproj \
            -scheme PKCS11RSPhoneSmoke \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          xcodebuild -quiet \
            -project examples/ios/PKCS11RSObjCSmoke/PKCS11RSObjCSmoke.xcodeproj \
            -scheme PKCS11RSObjCSmoke \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          xcodebuild -quiet \
            -project examples/ios/PKCS11RSCCIDStateTest/PKCS11RSCCIDStateTest.xcodeproj \
            -scheme PKCS11RSCCIDStateTest \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Run embedded virtual YubiKey PKCS #11 tests
        run: cargo test --locked --no-default-features --features embedded-virtual-yubikey preview_sign_embedded

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check ABI test backend
        run: cargo check --locked --features abi-tests

      - name: Run OpenSC and OpenSSL provider integration tests
        run: |
          python -m unittest discover -s integration -p 'test_*.py'
          python integration/run_clients.py \
            --openssl "$(brew --prefix openssl@3)/bin/openssl" \
            --provider "$(brew --prefix libp11)/lib/ossl-modules/pkcs11prov.dylib"

      - name: Upload client integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-integration-macos
          path: target/client-results.json
          if-no-files-found: warn

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-macos
          path: target/oasis-results
          if-no-files-found: warn

  architecture-check:
    name: Architecture check (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            libudev-dev \
            pkg-config

      - name: Install macOS native dependencies
        if: matrix.platform == 'macos'
        run: brew install pkg-config

      - name: Check all features
        run: cargo check --locked --all-features

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git -C ../virtual-yubikey fetch --depth 1 origin "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git -C ../virtual-yubikey checkout --detach "${{ env.VIRTUAL_YUBIKEY_REVISION }}"
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Rust tests
        id: rust-tests
        run: cargo test --locked

      - name: Identify crashing Rust test
        if: failure() && steps.rust-tests.outcome == 'failure'
        run: cargo test --locked --lib -- --test-threads=1

      - name: Build and exercise PKCS #11 DLL through its exported ABI
        run: |
          cargo build --locked
          cargo xtask load-shared-library

      - name: Run embedded virtual YubiKey PKCS #11 tests
        run: cargo test --locked --no-default-features --features embedded-virtual-yubikey preview_sign_embedded

      - name: Check ABI test backend
        run: cargo check --locked --features abi-tests

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-windows
          path: target/oasis-results
          if-no-files-found: warn
