name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            libpcsclite-dev \
            libudev-dev \
            opensc \
            pkg-config

      - name: Check generated PKCS #11 bindings
        run: cargo xtask bindings --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run release Rust tests
        run: cargo test --release --locked --all-features

      - name: Run mock YubiKey PKCS #11 tests
        run: cargo test --locked --features mock-yubikey preview_sign_mock

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-linux
          path: target/oasis-results
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            libudev-dev \
            pkg-config

      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace --all-features

      - name: Check binding generator minimum supported Rust version
        run: cargo check --locked --manifest-path xtask/Cargo.toml

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: pkcs11rs

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git virtual-yubihsm

      - name: Check workspace advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          manifest-path: ./pkcs11rs/Cargo.toml

      - name: Check binding generator advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
          manifest-path: ./pkcs11rs/xtask/Cargo.toml

  macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native dependencies
        run: |
          brew install pkg-config

      - name: Install iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Check generated PKCS #11 bindings
        run: cargo xtask bindings --check

      - name: Build dylib
        run: cargo build --locked

      - name: Build iOS XCFramework
        run: cargo xtask ios --release

      - name: Build iOS example applications
        run: |
          xcodebuild -quiet \
            -project examples/ios/PKCS11RSPhoneSmoke/PKCS11RSPhoneSmoke.xcodeproj \
            -scheme PKCS11RSPhoneSmoke \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          xcodebuild -quiet \
            -project examples/ios/PKCS11RSObjCSmoke/PKCS11RSObjCSmoke.xcodeproj \
            -scheme PKCS11RSObjCSmoke \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run mock YubiKey PKCS #11 tests
        run: cargo test --locked --features mock-yubikey preview_sign_mock

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check ABI test backend
        run: cargo check --locked --features abi-tests

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-macos
          path: target/oasis-results
          if-no-files-found: warn

  architecture-check:
    name: Architecture check (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev \
            libudev-dev \
            pkg-config

      - name: Install macOS native dependencies
        if: matrix.platform == 'macos'
        run: brew install pkg-config

      - name: Check all features
        run: cargo check --locked --all-features

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out first-party dependencies
        run: |
          git clone --depth 1 https://github.com/qpernil/software-key-core.git ../software-key-core
          git clone --depth 1 https://github.com/qpernil/usb-gadget-supervisor.git ../usb-gadget-supervisor
          git clone --depth 1 https://github.com/qpernil/display-backends.git ../display-backends
          git clone --depth 1 https://github.com/qpernil/virtual-yubikey.git ../virtual-yubikey
          git clone --depth 1 https://github.com/qpernil/virtual-yubihsm.git ../virtual-yubihsm

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build and exercise PKCS #11 DLL through its exported ABI
        run: |
          cargo build --locked
          cargo xtask load-shared-library

      - name: Run mock YubiKey PKCS #11 tests
        run: cargo test --locked --features mock-yubikey preview_sign_mock

      - name: Check ABI test backend
        run: cargo check --locked --features abi-tests

      - name: Run Python ABI tests
        run: python test_pkcs11.py

      - name: Run OASIS PKCS #11 3.2 profile cases
        run: python conformance/run_oasis.py --results target/oasis-results

      - name: Upload OASIS profile results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oasis-pkcs11-v3.2-results-windows
          path: target/oasis-results
          if-no-files-found: warn
