[package]
name = "pkcs11rs-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Asynchronous multi-device HTTP(S) gateway for locally attached YubiHSMs"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1"
clap = { version = "4.5.60", features = ["derive"] }
futures-util = "0.3.31"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
pkcs11rs-local-hardware = { path = "../pkcs11rs-local-hardware", default-features = false, features = ["async-tokio"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
hyper = { version = "1.11.0", features = ["client", "http2"] }
http-body-util = "0.1.3"
rcgen = "0.13.2"
serde_json = "1.0.149"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
