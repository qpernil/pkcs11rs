[package]
name = "platform-credential"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Platform-protected authentication credentials"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
software-key-core = { path = "../../../software-key-core" }
zeroize = "1.9.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
