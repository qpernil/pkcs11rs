[package]
name = "pkcs11rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PKCS #11 provider for YubiKey CCID and FIDO HID applications and YubiHSM devices"
readme = "README.md"
repository = "https://github.com/qpernil/pkcs11rs"
license = "MIT OR Apache-2.0"
keywords = ["pkcs11", "cryptoki", "yubikey", "yubihsm", "hsm"]
categories = ["api-bindings", "cryptography", "hardware-support"]

[workspace]
members = [
    ".",
    "crates/pkcs11rs-connector",
    "crates/pkcs11rs-local-hardware",
    "tools/pkcs11rs-tool",
]
default-members = [".", "crates/pkcs11rs-connector", "tools/pkcs11rs-tool"]
exclude = ["xtask"]
resolver = "2"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["native-hardware"]
abi-tests = []
mock-yubikey = []
native-hardware = ["dep:hidapi", "dep:pcsc", "dep:pkcs11rs-local-hardware"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
base64 = "0.22.1"
cmac = "0.7.2"
des = "0.8.1"
getrandom = "0.4.3"
ghash = "0.6.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
hkdf = "0.13.0"
hidapi = { version = "2.6.6", optional = true, default-features = false, features = ["linux-static-hidraw", "macos-shared-device", "windows-native"] }
minicbor = { version = "2.3.0", features = ["alloc"] }
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
pcsc = { version = "2.9.0", optional = true }
pkcs11rs-local-hardware = { path = "crates/pkcs11rs-local-hardware", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
flate2 = "1.1.9"
unicode-normalization = "0.1.25"
zeroize = "1.9.0"
const-oid = "0.10.2"
der = { version = "0.8.1", features = ["alloc", "derive", "std"] }
ecdsa = "0.17.0"
elliptic-curve = { version = "0.14.1", features = ["ecdh"] }
ed25519-dalek = "3.0.0"
p224 = { version = "=0.14.0-rc.15", default-features = false, features = ["ecdh", "ecdsa", "std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
bp256 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "sha256", "std"] }
bp384 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "sha384", "std"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
num-bigint-dig = "0.8.6"
pkcs8 = { version = "0.11.0", features = ["alloc", "encryption", "std"] }
primefield = "0.14.0"
primeorder = "0.14.0"
rsa = { version = "0.9.10", default-features = false, features = ["sha2", "std", "u64_digit"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.0", features = ["oid"] }
sha3 = "0.12.0"
signature = "3.0.0"
sec1 = { version = "0.8.1", features = ["alloc", "std"] }
spki = { version = "0.8.0", features = ["alloc", "std"] }
subtle = "2.6.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["builder", "std"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
webpki = { package = "rustls-webpki", version = "0.103.13", features = ["ring", "std"] }
