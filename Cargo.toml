[package]
name = "pkcs11rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PKCS #11 provider for YubiKey CCID and FIDO HID applications and YubiHSM devices"
readme = "README.md"
repository = "https://github.com/qpernil/pkcs11rs"
license = "MIT OR Apache-2.0"
keywords = ["pkcs11", "cryptoki", "yubikey", "yubihsm", "hsm"]
categories = ["api-bindings", "cryptography", "hardware-support"]

[lib]
crate-type = ["cdylib"]      # Creates dynamic lib
# crate-type = ["staticlib"] # Creates static lib

[features]
abi-tests = []
mock-yubikey = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.4"
cmac = "0.7.2"
des = "0.8.1"
getrandom = "0.4.3"
ghash = "0.6.0"
hmac = "0.13.0"
hkdf = "0.13.0"
hidapi = { version = "2.6.6", default-features = false, features = ["linux-static-hidraw", "macos-shared-device", "windows-native"] }
minicbor = { version = "2.3.0", features = ["alloc"] }
pbkdf2 = "0.13.0"
nusb = "0.2.5"
pcsc = "2.9.0"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
flate2 = "1.1.9"
unicode-normalization = "0.1.25"
zeroize = "1.9.0"
const-oid = "0.10.2"
der = { version = "0.8.1", features = ["alloc", "pem", "std"] }
ecdsa = "0.17.0"
ed25519-dalek = "3.0.0"
p224 = { version = "=0.14.0-rc.15", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
bp256 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
bp384 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
num-bigint-dig = "0.8.6"
pkcs8 = { version = "0.11.0", features = ["alloc", "pem", "std"] }
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.0", features = ["oid"] }
sha3 = "0.12.0"
signature = "3.0.0"
sec1 = { version = "0.8.1", features = ["alloc", "pem", "std"] }
spki = { version = "0.8.0", features = ["alloc", "pem", "std"] }
subtle = "2.6.1"
x509-cert = { version = "0.3.0", features = ["builder", "pem", "std"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
webpki = { package = "rustls-webpki", version = "0.103.13", features = ["ring", "std"] }
