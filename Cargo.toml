[package]
name = "pkcs11rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "PKCS #11 provider for YubiKey CCID and FIDO HID applications and YubiHSM devices"
readme = "README.md"
repository = "https://github.com/qpernil/pkcs11rs"
license = "MIT OR Apache-2.0"
keywords = ["pkcs11", "cryptoki", "yubikey", "yubihsm", "hsm"]
categories = ["api-bindings", "cryptography", "hardware-support"]

[workspace]
members = [
    ".",
    "crates/pkcs11rs-connector",
    "crates/pkcs11rs-local-hardware",
    "tools/pkcs11rs-tool",
]
default-members = [".", "crates/pkcs11rs-connector", "tools/pkcs11rs-tool"]
exclude = ["xtask"]
resolver = "3"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["native-hardware"]
abi-tests = ["dep:p256", "dep:virtual-yubihsm-core"]
mock-yubikey = ["dep:virtual-yubikey-core"]
native-hardware = ["dep:hidapi", "dep:pcsc", "dep:pkcs11rs-local-hardware"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
getrandom = "0.4.3"
hidapi = { version = "2.6.6", optional = true, default-features = false, features = ["linux-static-hidraw", "macos-shared-device", "windows-native"] }
minicbor = { version = "2.3.0", features = ["alloc"] }
pcsc = { version = "2.9.0", optional = true }
pkcs11rs-local-hardware = { path = "crates/pkcs11rs-local-hardware", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
flate2 = "1.1.9"
unicode-normalization = "0.1.25"
virtual-yubikey-core = { path = "../virtual-yubikey/crates/virtual-yubikey-core", optional = true }
virtual-yubihsm-core = { path = "../virtual-yubihsm/crates/virtual-yubihsm-core", optional = true }
software-key-core = { path = "../software-key-core" }
zeroize = "1.9.0"
const-oid = "0.10.2"
der = { version = "0.8.1", features = ["alloc", "derive", "std"] }
p256 = { version = "0.14.0", optional = true, default-features = false, features = ["ecdsa", "pkcs8", "precomputed-tables", "std"] }
pkcs8 = { version = "0.11.0", features = ["alloc", "encryption", "std"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sec1 = { version = "0.8.1", features = ["alloc", "std"] }
spki = { version = "0.8.0", features = ["alloc", "std"] }
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
x509-cert = { version = "0.3.0", default-features = false, features = ["builder", "std"] }
webpki = { package = "rustls-webpki", version = "0.103.13", features = ["ring", "std"] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
num-bigint-dig = "0.8.6"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "precomputed-tables", "std"] }
signature = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
virtual-yubihsm-core = { path = "../virtual-yubihsm/crates/virtual-yubihsm-core" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-crypto-token-kit = { version = "0.3.2", default-features = false, features = ["TKError", "TKSmartCard", "TKSmartCardATR", "TKSmartCardSlotNFCSession", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSError", "NSString"] }
