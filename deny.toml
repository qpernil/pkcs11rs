[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"
unsound = "all"
# Stable rsa has no patched release for the Marvin timing advisory. Software
# token RSA private operations are available only through the local PKCS #11
# interface; pkcs11rs does not expose or use them for network communication.
# Callers that relay local PKCS #11 operations over a network must assess that
# timing threat separately.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["BlueOak-1.0.0"], crate = "minicbor" },
]
